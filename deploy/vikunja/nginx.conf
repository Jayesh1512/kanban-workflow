worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 3456;
    server_name _;
    client_max_body_size 20m;

    location = /_antseed/kpis.js {
      alias /deploy/antseed-kpis.js;
      add_header Cache-Control "no-store" always;
    }

    location = /_antseed/kpis.css {
      alias /deploy/antseed-kpis.css;
      add_header Cache-Control "no-store" always;
    }

    location = /_antseed/kpis {
      set $backend http://backend:3000;
      proxy_pass $backend/api/outreach/status;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_set_header Host $host;
      add_header Cache-Control "no-store" always;
    }

    location / {
      proxy_pass http://127.0.0.1:3457;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 120s;
      sub_filter_once on;
      sub_filter '</head>' '<link rel="stylesheet" href="/_antseed/kpis.css"><script defer src="/_antseed/kpis.js"></script></head>';
    }
  }
}
